---
name: MySQL Schema Check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "schema.sql"
  merge_group:
  push:
    paths:
      - "schema.sql"
    branches:
      - main

jobs:
  mysql-schema-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: canary
          MYSQL_USER: canary
          MYSQL_PASSWORD: canary
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
    name: Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
      - name: Check MySQL service
        run: |
          docker exec "${{ job.services.mysql.id }}" sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --user=canary --database=canary --execute="SELECT VERSION(), DATABASE();"'
      - name: Import Canary Schema
        run: |
          # The schema defines triggers, which require the service admin with binlog enabled.
          docker exec --interactive "${{ job.services.mysql.id }}" sh -c \
            'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql --user=root --database=canary' < schema.sql
