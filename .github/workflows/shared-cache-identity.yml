name: shared cache identity

on:
  pull_request:
    paths:
      - 'cmake/SharedBuildCache.cmake'
      - 'tools/*shared*cache*'
      - '.github/workflows/shared-cache-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Test dependency identities without compiling
        run: python tools/test_shared_cache_identity.py -v
